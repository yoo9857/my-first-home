<!DOCTYPE html>
<!-- 1. 이 문서가 HTML5라고 브라우저에 알려줍니다 -->
<html lang="ko">
  <!-- 2. head: 화면에 안 보이는 정보 (제목, 글자 설정 등) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 첫 홈페이지</title>

    <!-- 4. style: 화면을 꾸미는 CSS는 style.css 파일에 따로 있어요 -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <!-- 3. body: 화면에 실제로 보이는 내용 -->
  <body>
    <!-- 홀로그램 프로필 사진: 마우스를 따라 기울고 무지개빛으로 반짝여요 -->
    <div class="holo-scene" id="holo">
      <div class="holo-photo">
        <!-- img: 사진 넣기 (src=사진 파일, alt=사진 설명, width=가로 크기) -->
        <img src="profile.webp" alt="내 프로필 사진" width="200" height="200" draggable="false" />
        <span class="holo-foil" aria-hidden="true"></span>
        <span class="holo-glare" aria-hidden="true"></span>
      </div>
    </div>

    <!-- 7. 미니 MP3 플레이어 (audio의 loop → 끝나면 처음부터 반복) -->
    <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
    <div class="player" id="player">
      <div class="player-title">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Contented Game Loop</span>
      </div>
      <div class="player-progress">
        <span id="curTime">0:00</span>
        <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="재생 위치" />
        <span id="durTime">0:00</span>
      </div>
      <div class="player-controls">
        <button id="restartBtn" type="button" aria-label="처음부터">⏮</button>
        <button id="playBtn" class="play-btn" type="button" aria-label="재생">▶</button>
        <button id="stopBtn" type="button" aria-label="정지">⏹</button>
        <button id="muteBtn" type="button" aria-label="음소거" aria-pressed="false">🔊</button>
      </div>
    </div>

    <!-- a: 링크 (mailto: 를 붙이면 누를 때 메일 쓰기 창이 열려요) -->
    <p><a class="email" href="mailto:hanbin9857@naver.com">hanbin9857@naver.com</a></p>

    <!-- 마그네틱 글로우 버튼 (target="_blank" → 새 탭에서 열기) -->
    <!-- aria-hidden="true": 꾸밈용 조각이라 화면 읽기 프로그램은 건너뛰게 -->
    <p class="btn-row">
      <a class="glow-btn yt" href="https://www.youtube.com/@AI_ohssaem" target="_blank" rel="noopener">
        <span class="glow-ring" aria-hidden="true"></span>
        <span class="glow-blur" aria-hidden="true"></span>
        <span class="glow-inner">
          <span class="glow-light" aria-hidden="true"></span>
          <span class="glow-label">▶ 내 유튜브 보러가기</span>
        </span>
      </a>
      <a class="glow-btn insta" href="https://www.instagram.com/" target="_blank" rel="noopener">
        <span class="glow-ring" aria-hidden="true"></span>
        <span class="glow-blur" aria-hidden="true"></span>
        <span class="glow-inner">
          <span class="glow-light" aria-hidden="true"></span>
          <span class="glow-label">◎ 내 인스타 보러가기</span>
        </span>
      </a>
    </p>

    <h1>안녕하세요!</h1>
    <p>상상을 프롬프트로, 프롬프트를 현실로.</p>

    <!-- 6. script: 움직임을 만드는 JavaScript는 script.js 파일에 따로 있어요 -->
    <script src="script.js"></script>
  </body>
</html>
